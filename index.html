.intro{background:var(--surface);border-left:8px solid var(--role);padding:1.1rem 1.25rem;border-radius:0 12px 12px 0;margin:1.5rem 0}

  background:var(--role) center/cover no-repeat;color:#fff;font:inherit;text-align:left}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05) 60%)}

.vid .vt{position:absolute;left:.7rem;right:.7rem;bottom:.55rem;z-index:1;font-size:.86rem;font-weight:700;line-height:1.25}
.vid:hover .pl{filter:brightness(1.12)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2}
.vid.off{cursor:default;display:grid;place-items:center;padding:1rem;text-align:center}
.vid.off::after{display:none}
.vid.off a{color:#fff;font-weight:700}

.btn.gg{border-color:var(--line);color:var(--ink)}

.empty{grid-column:1/-1;color:var(--muted);padding:1rem 0}

.drill{background:var(--role);color:#fff;border-radius:18px;padding:1.5rem;margin-bottom:2.5rem}
.drill h2{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0 0 .75rem;font-size:1.3rem}
.drill ol{margin:0;padding-left:1.3rem}
.drill li{margin:.3rem 0}

footer ul{padding-left:1.1rem;margin:.5rem 0 1rem}
footer a{color:var(--sky)}

.tools select{font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:.35rem .5rem}

.dl .un{font-size:.92rem;color:var(--muted);margin:.75rem 0 0}

.vbody{flex:1;display:flex}
.vbody webview{flex:1;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

["Take the best shotgun","The team’s strongest weapon is yours. Ask teammates to pass you upgrades, and save mats for fights, not long rotations.","fortnite fragger loadout competitive"],
["Practise piece control daily","Ten to fifteen minutes a day in creative piece-control and edit maps beats hours of casual play.","fortnite piece control map codes"],
["Grab tags mid-game","Damage on passing teams earns points without exposing you. Hit the shot, call it, and get back to position; don’t chase alone.","fortnite how to get tags mid game"],
["Always call your damage","A short call like “hit the pink skin for 120” lets the team decide whether to push. Without it, nobody can follow you.","fortnite callouts communication tips trios"],
["Play for the trade","If you get knocked, your team should be able to trade your knock for an elimination. Fight close to your support, never three builds away.","fortnite trading trios fight tips"]],
drill:["10 min edit course warm-up","15 min of 1v1 piece control","5 min of shotgun aim training","One ranked game focused only on calling damage"]},
igl:{name:"IGL",short:"Calls the game",what:"You make the calls: drop, rotations, when to fight and when to leave. Pros say decision-making is now the skill that most separates good players from top players.",tips:[
["Have a set off-spawn plan","Pick a drop with enough loot, mats and mobility for all three, and practise it until it’s automatic. Leave with at least 1,000 mats each.","fortnite off spawn guide competitive drop spot"],
["Rotate early","The earlier you move to the next zone, the fewer teams are in your way. Decide the route before the zone closes, not when the storm is on you.","fortnite rotation guide competitive"],
["One voice on decisions","Short, firm calls: “we rotate left now”. Listen to your team, but avoid two people giving orders at once.","how to igl fortnite"],
["Pick your fights","Before you push, ask: who can third-party us? If the fight will be slow and teams are nearby, let it go.","fortnite fight selection third party"],
["Set up the endgame","In the final zones, layers and tarping decide who survives. Keep the team together and stocked on mats, and decide who builds the tunnel.","fortnite tarping tutorial endgame"],
["Review your replays","Watch your games and FNCS games. Change the plan when it fails; making the same decisions every game is the most common way to plateau.","fortnite vod review replay how to improve"]],
drill:["Watch 1 FNCS game and note the rotations","IGL at least 2 scrims a week","Review 1 of your replays and write down 3 bad calls","Run your off-spawn 5 times in a row"]},
suporte:{name:"Support",short:"Keeps the team alive",what:"You keep the fragger alive and the team stocked. You’re not just “the heals guy”: you hold angles, drop mats and call who’s coming.",tips:[
["Carry the team’s heals","A common trios setup: support with heals in three slots, fragger with mobility and two heals, IGL with the rest. Hand them out before fights, not after.","fortnite support role guide trios"],
["Stay close to the fragger","Stay behind them to cover third parties. If they go down, you’re in position to trade or to res.","fortnite support player positioning"],
["Drop mats for the IGL and fragger","Whoever rotates and whoever fights spends the most. Drop mats without being asked when you see them running low.","fortnite drop mats teammates trios"],
["Build to protect","In Build, your walls and cones keep the fragger alive mid-fight. In Zero Build, hold cover and call the third team.","fortnite support building protect teammate"],
["Count enemies and share info","Say how many, where they are and who’s low. Clear info is worth as much as an elimination.","fortnite callouts guide"],
["Play in formation","In trios, the support sits slightly behind and centred, watching what the other two can’t see. A set formation stops the team from spreading out and getting picked off one by one.","fortnite trio formation"]],
drill:["Practise fast heal swaps in creative","10 min of defensive builds (protect cone/wall)","One game doing only enemy callouts","One game holding a triangle formation the whole time"]}}},

function detectLang(){
  try{ const s = localStorage.getItem("lang"); if(s && L[s]) return s; }catch(e){}
  const n = (navigator.language || "pt-PT").toLowerCase();
  if(n.startsWith("pt-br")) return "pt-BR";
  if(n.startsWith("pt")) return "pt-PT";
  if(n.startsWith("fr")) return "fr";
  if(n.startsWith("es")) return "es";
  return "en";
}

        <div class="acts">
          <a class="btn yt" data-kind="yt" data-q="${esc(t[2])}" data-t="${esc(t[0])}" href="${yt(t[2])}" target="_blank" rel="noopener">${esc(u.yt)}</a>
          <a class="btn gg" data-kind="gg" data-q="${esc(t[2])}" data-t="${esc(t[0])}" href="${gg(t[2])}" target="_blank" rel="noopener">${esc(u.gg)}</a>
        </div>
      </article>`; }).join("") : `<p class="empty">${esc(u.empty.replace("{q}", filter))}</p>`}
    </section>
    <section class="drill"><h2>${esc(u.drill)}</h2><ol>${d.drill.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>`;
  document.getElementById("q").addEventListener("input", e => {
    const pos = e.target.selectionStart; render(e.target.value);
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos);
  });
}

function applyLang(){
  const u = L[lang].ui;
  document.documentElement.lang = lang;
  document.title = u.title;
  document.getElementById("lang").value = lang;
  document.getElementById("lang").setAttribute("aria-label", u.lang);
  document.getElementById("lede").textContent = u.lede;
  document.getElementById("theme").textContent = u.theme;
  document.getElementById("srcTitle").textContent = u.sources;
  document.getElementById("note").textContent = u.note;
  document.getElementById("roles").setAttribute("aria-label", u.roles);
  document.querySelectorAll(".role-btn").forEach(b => {
    const r = L[lang].roles[b.dataset.role];
    b.querySelector(".rn").textContent = r.name;
    b.querySelector(".rd").textContent = r.short;
  });
  render();
  renderDl();
}

function select(r){
  role = L[lang].roles[r] ? r : "igl";
  document.querySelectorAll(".role-btn").forEach(b => b.setAttribute("aria-selected", b.dataset.role===role));
  document.documentElement.style.setProperty("--role", colors[role]);
  render();
}

document.querySelectorAll(".role-btn").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.role; }));
window.addEventListener("hashchange", () => select(location.hash.slice(1)));
document.getElementById("lang").addEventListener("change", e => {
  lang = e.target.value;
  try{ localStorage.setItem("lang", lang); }catch(err){}
  applyLang();
});

try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
document.getElementById("theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("theme", next); }catch(e){}
});

// Leitor incorporado: o vídeo toca dentro do cartão da dica
function vidOff(v){
  return `<div class="vid off"><p>${esc(VT[lang].off)}<br><a href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" rel="noopener">${esc(VT[lang].open)} ↗</a></p></div>`;
}
panel.addEventListener("click", e => {
  const b = e.target.closest("button.vid[data-v]");
  if(!b) return;
  const id = b.dataset.v;
  const hl = lang.slice(0,2);
  b.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&hl=${hl}&cc_lang_pref=${hl}" title="${esc(b.getAttribute("aria-label") || "")}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  b.removeAttribute("aria-label");
});
// Se o ambiente bloquear vídeos incorporados (ex.: pré-visualização com política de segurança), mostra o link
document.addEventListener("securitypolicyviolation", e => {
  if(!/youtube/.test(e.blockedURI || "")) return;
  embedBlocked = true;
  document.querySelectorAll(".vid[data-v]").forEach(b => {
    const v = Object.values(VID).flat().find(x => x[0] === b.dataset.v);
    if(v) b.outerHTML = vidOff(v);
  });
});

// Visualizador integrado (só na app Windows): pesquisas e páginas abrem dentro da app
const viewer = document.getElementById("viewer");
let wv = null;
function openViewer(url, title){
  document.getElementById("vTitle").textContent = title;
  document.getElementById("vBack").textContent = VI[lang].back;
  document.getElementById("vClose").textContent = VI[lang].close;
  viewer.hidden = false;
  if(!wv){ wv = document.createElement("webview"); wv.setAttribute("allowpopups",""); document.getElementById("vBody").appendChild(wv); }
  wv.src = url;
}
function closeViewer(){ viewer.hidden = true; if(wv){ wv.src = "about:blank"; } }
document.getElementById("appLink").addEventListener("click", () => document.getElementById("dl").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}));
if(IN_APP){
  // Dentro da app não faz sentido mostrar o download
  document.getElementById("dl").hidden = true;
  document.getElementById("appLink").hidden = true;
  panel.addEventListener("click", e => {
    const a = e.target.closest("a[target=_blank]");
    if(!a) return;
    e.preventDefault();
    const t = a.closest(".tip");
    openViewer(a.href + (a.dataset.kind ? "&hl=" + HL[lang] : ""), t ? t.querySelector("h3").textContent : a.textContent);
  });
  document.getElementById("vBack").addEventListener("click", () => { if(wv && wv.canGoBack()) wv.goBack(); else closeViewer(); });
  document.getElementById("vClose").addEventListener("click", closeViewer);
  document.addEventListener("keydown", e => { if(e.key==="Escape" && !viewer.hidden) closeViewer(); });
}

applyLang();
select(location.hash.slice(1));
</script>
</body>
</html>
